<main class="mx-auto max-w-6xl px-4 py-12 sm:px-8 sm:py-16">
  <h1 class="font-display text-3xl font-semibold text-paper sm:text-4xl">{{ s.heading }}</h1>
  <p class="mt-2 text-muted">{{ s.lead }}</p>

  <ul class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    <li>
      <a
        routerLink="/admin/publicidade"
        class="group flex h-full flex-col rounded-3xl bg-surface p-7 shadow-raised transition-shadow hover:shadow-raised-lg"
      >
        <span class="font-display text-xl font-semibold text-paper">{{ generator.cardTitle }}</span>
        <span class="mt-2 text-sm leading-relaxed text-muted">{{ generator.cardText }}</span>
        <span class="mt-6 text-sm font-medium text-accent-soft">
          {{ total() === null ? '' : s.generated(total()!) }}
        </span>
      </a>
    </li>
    <li>
      <div class="flex h-full flex-col rounded-3xl border border-dashed border-line p-7 opacity-70">
        <span class="font-display text-xl font-semibold text-faint">{{ s.comingSoon }}</span>
        <span class="mt-2 text-sm text-faint">{{ s.comingSoonText }}</span>
      </div>
    </li>
  </ul>
</main>
