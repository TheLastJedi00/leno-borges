<main class="flex min-h-screen items-center justify-center px-4 py-16">
  <div class="w-full max-w-sm rounded-3xl bg-surface p-8 shadow-raised-lg sm:p-10">
    <img class="mx-auto h-10 w-auto" src="images/logo.svg" width="46" height="40" alt="" />
    <h1 class="mt-6 text-center font-display text-2xl font-semibold text-paper">{{ s.heading }}</h1>

    @if (ready()) {
      @if (auth.signedIn()) {
        <p class="mt-2 text-center text-sm text-muted">{{ s.lead }}</p>
        <form (ngSubmit)="submit()" class="mt-8">
          <label class="block">
            <span class="text-sm font-medium text-paper">{{ s.password }}</span>
            <input
              type="password"
              name="password"
              autocomplete="new-password"
              required
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              class="mt-2 w-full rounded-xl bg-ink px-4 py-3 text-paper shadow-inset outline-none ring-accent focus-visible:ring-2"
            />
          </label>
          <label class="mt-5 block">
            <span class="text-sm font-medium text-paper">{{ s.confirm }}</span>
            <input
              type="password"
              name="confirm"
              autocomplete="new-password"
              required
              [ngModel]="confirm()"
              (ngModelChange)="confirm.set($event)"
              class="mt-2 w-full rounded-xl bg-ink px-4 py-3 text-paper shadow-inset outline-none ring-accent focus-visible:ring-2"
            />
          </label>

          <p class="mt-4 min-h-5 text-sm text-kit-error" role="alert">{{ error() }}</p>

          <button
            type="submit"
            [disabled]="saving() || !password() || !confirm()"
            class="mt-2 w-full rounded-full bg-accent-deep px-4 py-3 text-sm font-semibold text-white shadow-raised transition-[filter,box-shadow] hover:brightness-110 active:shadow-inset disabled:cursor-not-allowed disabled:opacity-60"
          >
            {{ saving() ? s.submitting : s.submit }}
          </button>
        </form>
      } @else {
        <p class="mt-6 text-center text-sm text-muted" role="alert">
          {{ auth.linkError() ?? s.noSession }}
        </p>
        <a
          routerLink="/admin/login"
          class="mt-6 block text-center text-sm text-faint transition-colors hover:text-paper"
        >
          {{ s.login }}
        </a>
      }
    }
  </div>
</main>
