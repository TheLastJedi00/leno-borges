<header
  class="fixed inset-x-0 top-0 z-50 border-b transition-[background-color,border-color,box-shadow] duration-300"
  [class]="
    scrolled()
      ? 'border-line/70 bg-ink/80 shadow-[0_8px_24px_rgb(0_0_0/0.35)] backdrop-blur-md'
      : 'border-transparent bg-transparent'
  "
>
  <nav
    class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3.5 sm:px-8"
    aria-label="Principal"
  >
    <a routerLink="/" class="-m-1.5 shrink-0 rounded-xl p-1.5">
      <span class="sr-only">Leno Borges — início</span>
      <img class="h-8 w-auto" src="images/logo.svg" width="37" height="32" alt="" />
    </a>

    <ul class="hidden items-center gap-1 md:flex">
      @for (item of nav; track item.fragment) {
        <li>
          <a
            routerLink="/"
            [fragment]="item.fragment"
            class="rounded-full px-3.5 py-2 text-sm font-medium text-muted transition-colors hover:bg-surface hover:text-paper"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-3">
      <a
        routerLink="/"
        fragment="contato"
        class="rounded-full bg-accent-deep px-4 py-2 text-sm font-semibold text-white shadow-raised transition-[filter,box-shadow] hover:brightness-110 active:shadow-inset"
      >
        Contato
      </a>
    </div>
  </nav>
</header>
