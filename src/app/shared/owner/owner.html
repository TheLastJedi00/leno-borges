<figure class="rounded-[2rem] bg-surface p-2 shadow-raised-lg">
  <div class="relative overflow-hidden rounded-[1.6rem]">
    <picture>
      <source srcset="images/leno.webp" type="image/webp" />
      <img
        ngSrc="images/leno.jpg"
        width="900"
        height="1125"
        priority
        class="h-full w-full object-cover"
        alt="Leno Borges, de jaqueta de couro preta, explicando um conceito em sala de aula na ProWay"
      />

    <div

    <figcaption
      class="absolute bottom-4 left-4 rounded-full bg-ink/70 px-3 py-1.5 font-mono text-[11px] uppercase tracking-[0.15em] text-paper/90 backdrop-blur-sm"

      Em aula · ProWay, Blumenau
