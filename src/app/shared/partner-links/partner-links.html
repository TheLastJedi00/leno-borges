@if (partners()?.length) {
  <p class="flex flex-wrap items-center gap-x-2 gap-y-1 font-mono text-xs">
    <span class="text-faint">{{ label() }}<span class="sr-only">:</span></span>
    @for (p of partners(); track p.linkedin; let last = $last) {
      <a
        [href]="p.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        class="group/partner inline-flex items-center gap-1.5 rounded text-accent-soft transition-colors hover:text-paper focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
      >
        <svg class="h-3.5 w-3.5 shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"
            clip-rule="evenodd"
          />
        </svg>
        <span>{{ p.name }}</span>
        <span class="sr-only">, {{ linkedinLabel() }} {{ newTabLabel() }}</span>
        <span
          aria-hidden="true"
          class="transition-transform group-hover/partner:-translate-y-0.5 group-hover/partner:translate-x-0.5 motion-reduce:transition-none"
          >↗</span
        >
      </a>
      @if (!last) {
        <span aria-hidden="true" class="text-faint">·</span>
      }
    }
  </p>
}
