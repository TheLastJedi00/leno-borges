<article class="rounded-2xl bg-surface p-6 shadow-raised sm:p-8">
  <p class="font-mono text-xs uppercase tracking-wider text-muted">{{ period() }}</p>
  <h3 class="mt-2 font-display text-2xl font-semibold tracking-tight text-paper sm:text-3xl">
    {{ title() }}
  </h3>
  <p class="mt-1 text-sm font-semibold text-accent-soft">{{ institution() }}</p>

  @if (modules()?.length) {
    <ol class="mt-6 grid gap-4 sm:grid-cols-2">
      @for (m of modules(); track m.name) {
        <li class="rounded-xl bg-ink/40 p-4 shadow-inset">
          <p class="text-[15px] font-semibold text-paper">{{ m.name }}</p>
          <p class="mt-0.5 font-mono text-[11px] uppercase tracking-wider text-faint">
            {{ m.hours }}
          </p>
          <p class="mt-2 text-sm leading-relaxed text-muted">{{ m.description }}</p>
        </li>
      }
    </ol>
  }
</article>
