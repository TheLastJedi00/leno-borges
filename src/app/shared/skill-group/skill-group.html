<div class="h-full border-t border-line pt-5">
  <h3 class="font-mono text-xs uppercase tracking-[0.2em] text-faint">{{ category() }}</h3>
  <ul class="mt-4 flex flex-wrap gap-x-4 gap-y-2">
    @for (s of skills(); track s) {
      <li class="font-display text-2xl leading-tight text-paper">{{ s }}</li>
    }
  </ul>
</div>
