<div class="h-full rounded-2xl bg-surface p-6 shadow-raised">
  <h3 class="font-mono text-xs uppercase tracking-[0.2em] text-faint">{{ category() }}</h3>
  <ul class="mt-5 flex flex-wrap gap-2.5">
    @for (s of skills(); track s) {
      <li><app-tech-icon [name]="s" size="md"></app-tech-icon></li>
    }
  </ul>
</div>
